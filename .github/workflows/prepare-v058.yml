name: Prepare Dorong v0.5.8

on:
  push:
    branches:
      - 'v0.5.8-multimonitor'
    paths:
      - '.github/workflows/prepare-v058.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 'v0.5.8-multimonitor'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Apply changes
        run: python scripts/prepare_v058.py

      - name: Format
        run: gofmt -w core_windows.go app_windows.go monitor_windows.go

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -trimpath -ldflags="-H=windowsgui -s -w" -o Dorong-v0.5.8.exe .

      - name: Commit prepared branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prepare-v058.yml scripts/prepare_v058.py
          git add core_windows.go app_windows.go monitor_windows.go VERSION README.md docs/ROADMAP.md
          git commit -m "feat: add multi-monitor support for v0.5.8"
          git push origin HEAD:v0.5.8-multimonitor
