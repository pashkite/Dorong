name: Build Dorong

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Apply VERSION to Windows source
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $source = Get-Content core_windows.go -Raw
          $pattern = 'AppVersion\s*=\s*"[^"]+"'
          if ($source -notmatch $pattern) {
            throw 'AppVersion marker was not found in core_windows.go'
          }
          $patched = [regex]::Replace($source, $pattern, "AppVersion = `"$version`"")
          Set-Content core_windows.go -Value $patched -NoNewline -Encoding utf8

      - name: Test core logic, localization, movement, hanging, and sprites
        shell: pwsh
        run: go test ./...

      - name: Build startup-smoke EXE
        shell: pwsh
        run: go build -trimpath -o Dorong-startup-smoke.exe .

      - name: Verify Dorong actually stays running
        shell: pwsh
        run: |
          $stdout = Join-Path $PWD 'dorong-smoke-stdout.txt'
          $stderr = Join-Path $PWD 'dorong-smoke-stderr.txt'
          $p = Start-Process -FilePath (Join-Path $PWD 'Dorong-startup-smoke.exe') -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            Write-Host "Dorong exited during startup smoke test with code $($p.ExitCode)"
            if (Test-Path $stdout) { Write-Host '--- stdout ---'; Get-Content $stdout -Raw }
            if (Test-Path $stderr) { Write-Host '--- stderr ---'; Get-Content $stderr -Raw }
            exit 1
          }
          Write-Host "Dorong remained running for 8 seconds (PID $($p.Id))."
          Stop-Process -Id $p.Id -Force

      - name: Build versioned Dorong EXE
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          go build -trimpath -ldflags="-H=windowsgui -s -w" -o "Dorong-v$version.exe" .

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }

      - name: Build versioned Dorong Setup EXE
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $portable = "Dorong-v$version.exe"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$version" "/DMyAppExeName=$portable" "installer\Dorong.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup build failed with exit code $LASTEXITCODE"
          }
          $setup = "Dorong-Setup-v$version.exe"
          if (-not (Test-Path $setup)) {
            throw "$setup was not created"
          }

      - name: Install and launch the packaged build
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $setup = Join-Path $PWD "Dorong-Setup-v$version.exe"
          $installDir = Join-Path $env:RUNNER_TEMP 'DorongInstallSmoke'
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }

          $installer = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$installDir" -Wait -PassThru
          if ($installer.ExitCode -ne 0) {
            throw "Installer smoke test failed with exit code $($installer.ExitCode)"
          }

          $installed = Join-Path $installDir 'Dorong.exe'
          if (-not (Test-Path $installed)) {
            throw "Installed Dorong.exe was not found at $installed"
          }

          $p = Start-Process -FilePath $installed -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            throw "Installed Dorong.exe exited early with code $($p.ExitCode)"
          }
          Write-Host "Installed Dorong.exe remained running for 8 seconds (PID $($p.Id))."
          Stop-Process -Id $p.Id -Force

          $uninstaller = Get-ChildItem $installDir -Filter 'unins*.exe' | Select-Object -First 1
          if ($uninstaller) {
            Start-Process -FilePath $uninstaller.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          }

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dorong-windows-amd64
          path: |
            Dorong-v*.exe
            Dorong-Setup-v*.exe
          if-no-files-found: error

      - name: Publish versioned GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          $portable = "Dorong-v$version.exe"
          $setup = "Dorong-Setup-v$version.exe"
          $notes = @"
          Windows 64-bit release of Dorong $tag.

          Startup hotfix release:
          - Replaces the corrupted embedded sprite payload with a safe built-in Dorong fallback sheet.
          - Adds sprite decode coverage.
          - Releases are now blocked unless Dorong survives a real Windows startup smoke test.
          - The installer itself is silently installed and its packaged Dorong.exe is launched before publishing.

          Files:
          - Dorong-Setup-v$version.exe: recommended installer. Adds Start Menu/uninstall registration and offers an optional desktop shortcut.
          - Dorong-v$version.exe: portable standalone build. No installation is required.

          No Python, Go, or .NET runtime is required.
          "@
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $portable $setup --clobber --repo "${{ github.repository }}"
            gh release edit $tag --repo "${{ github.repository }}" --notes $notes
          } else {
            gh release create $tag $portable $setup --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Dorong $tag" --notes $notes
          }
