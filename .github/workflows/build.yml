name: Build Dorong

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Apply VERSION to Windows source
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $source = Get-Content core_windows.go -Raw
          $patched = [regex]::Replace($source, 'AppVersion\s*=\s*"[^"]+"', "AppVersion = `"$version`"")
          if ($patched -eq $source) {
            throw 'AppVersion marker was not found in core_windows.go'
          }
          Set-Content core_windows.go -Value $patched -NoNewline -Encoding utf8

      - name: Test core logic, localization, movement, and hanging
        shell: pwsh
        run: go test ./...

      - name: Build versioned Dorong EXE
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          go build -trimpath -ldflags="-H=windowsgui -s -w" -o "Dorong-v$version.exe" .

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dorong-windows-amd64
          path: Dorong-v*.exe
          if-no-files-found: error

      - name: Publish versioned GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          $exe = "Dorong-v$version.exe"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag $exe --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Dorong $tag" --notes "Windows 64-bit standalone build of Dorong $tag. No Python, Go, or .NET runtime is required to run the prebuilt EXE."
          }
