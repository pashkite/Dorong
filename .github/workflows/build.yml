name: Build Dorong

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Test core logic, localization, movement, and hanging
        shell: pwsh
        run: go test ./...

      - name: Build Dorong.exe
        shell: pwsh
        run: go build -trimpath -ldflags="-H=windowsgui -s -w" -o Dorong.exe .

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Dorong-windows-amd64
          path: Dorong.exe
          if-no-files-found: error
