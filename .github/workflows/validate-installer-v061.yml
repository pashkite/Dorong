name: Validate Dorong v0.6.1 Installer

on:
  push:
    branches:
      - 'v0.6.1-installer'
    paths:
      - '.github/workflows/validate-installer-v061.yml'

permissions:
  contents: write

jobs:
  validate-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 'v0.6.1-installer'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Apply VERSION
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $source = Get-Content core_windows.go -Raw
          $pattern = 'AppVersion\s*=\s*"[^"]+"'
          if ($source -notmatch $pattern) { throw 'AppVersion marker missing' }
          $patched = [regex]::Replace($source, $pattern, "AppVersion = `"$version`"")
          Set-Content core_windows.go -Value $patched -NoNewline -Encoding utf8

      - name: Test
        shell: pwsh
        run: go test ./...

      - name: Build portable EXE
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          go build -trimpath -ldflags="-H=windowsgui -s -w" -o "Dorong-v$version.exe" .

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler missing' }

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$version" "/DMyAppExeName=Dorong-v$version.exe" "installer\Dorong.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          $setup = "Dorong-Setup-v$version.exe"
          if (-not (Test-Path $setup)) { throw "$setup missing" }
          Get-Item $setup | Format-List Name,Length

      - name: Silent install smoke test
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $setup = Join-Path $PWD "Dorong-Setup-v$version.exe"
          $proc = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Installer exit code $($proc.ExitCode)" }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\Dorong\Dorong.exe'
          if (-not (Test-Path $installed)) { throw "Installed Dorong.exe missing at $installed" }

      - name: Silent uninstall smoke test
        shell: pwsh
        run: |
          $uninstaller = Join-Path $env:LOCALAPPDATA 'Programs\Dorong\unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller missing at $uninstaller" }
          $proc = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Uninstaller exit code $($proc.ExitCode)" }
          Start-Sleep -Seconds 1
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\Dorong\Dorong.exe'
          if (Test-Path $installed) { throw 'Dorong.exe remained after uninstall' }

      - name: Remove temporary validation workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-installer-v061.yml
          git commit -m "chore: remove temporary installer validation workflow"
          git push origin HEAD:v0.6.1-installer
