name: Diagnose Dorong startup

on:
  push:
    branches: [v0.6.1-startup-diagnosis]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Apply VERSION
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $source = Get-Content core_windows.go -Raw
          $pattern = 'AppVersion\s*=\s*"[^"]+"'
          if ($source -notmatch $pattern) { throw 'AppVersion marker not found' }
          $patched = [regex]::Replace($source, $pattern, "AppVersion = `"$version`"")
          Set-Content core_windows.go -Value $patched -NoNewline -Encoding utf8

      - name: Report sprite LZW corruption offset
        shell: pwsh
        run: go test ./... -run TestReportSpriteLZWCorruptionOffset -v
